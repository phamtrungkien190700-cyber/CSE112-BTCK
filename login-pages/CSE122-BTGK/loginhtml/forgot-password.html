<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | LegalPath</title>
  <link rel="stylesheet" href="../css/forgot-password/laptop.css">
  <link rel="stylesheet" href="../css/forgot-password/tablet.css" media="(min-width: 600px) and (max-width: 1023px)">
  <link rel="stylesheet" href="../css/forgot-password/mobile.css" media="(max-width: 599px)">
</head>
<body>
  <main class="page">
    <!-- logo-web -->
    <p class="security-note security-note--top">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.2 16 4.5v4.8c0 4-2.5 6.7-6 8.5-3.5-1.8-6-4.5-6-8.5V4.5l6-2.3Z"/>
        <path d="m7.5 9.7 1.7 1.7 3.5-3.6"/>
      </svg>
      <span>Thông tin của bạn luôn được bảo mật tại LegalPath</span>
    </p>

    <section class="auth-card auth-card--forgot" aria-labelledby="page-title">
      <header class="brand">
        <a class="brand-logo" href="login.html" aria-label="LegalPath - Trang chủ">
          <img class="brand-image" src="../../../shared/legalpath-logo.png" alt="LegalPath - Pháp luật gần bạn hơn">
        </a>
        <p class="brand-tagline">Điều hướng thông tin pháp lý phổ thông</p>
      </header>
      <!---------------------------------------------------------------->
      <div class="divider"></div>

      <!-- title-forgot-passworrd -->
      <div class="intro">
        <h1 id="page-title">Quên mật khẩu</h1>
        <p>Nhập số điện thoại hoặc email để kiểm tra tài khoản đã đăng ký.</p>
      </div>
      <!------------------------------------------------------------------->

      <!-- input-email or numbers -->
      <form class="auth-form" data-auth="forgot">
        <div class="field">
          <label for="recovery-identity">Số điện thoại hoặc email</label>
          <input id="recovery-identity" name="identity" type="text" placeholder="Nhập số điện thoại hoặc email" required autocomplete="username">
        </div>

        <button class="primary-button" type="submit">Gửi yêu cầu khôi phục</button>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>
      <!------------------------------------------------------------------>

      <p class="recovery-note">Dịch vụ gửi hướng dẫn đặt lại mật khẩu qua email/SMS hiện chưa được tích hợp.</p>
      <a class="back-link" href="login.html">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M8 4 3 9l5 5M3.5 9H17"/>
        </svg>
        Quay lại đăng nhập
      </a>
    </section>
    <script src="../js/auth-api.js" defer></script>
    <script src="../js/forgot-password/forgot-password.js" defer></script>
  </main>
</body>
</html>
