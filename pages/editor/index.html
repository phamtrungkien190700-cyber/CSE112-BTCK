<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8fb">
    <title>LegalPath - Không gian biên tập</title>
  <link rel="stylesheet" href="/css/pages/editor/shell/style.css">
  <link rel="stylesheet" href="/css/pages/editor/shell/responsive.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/pages/editor/shell.js" defer></script>
</head>
<body data-required-role="editor">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="#queue" aria-label="LegalPath - Trang chủ">
                <span class="brand-mark">⚖</span>
                <span>
                    <strong>LegalPath</strong>
                    <small>Pháp luật gần bạn hơn</small>
                </span>
            </a>
            <nav class="side-nav" aria-label="Điều hướng chính">
              <a class="nav-link" href="#queue" data-page="queue"><span>☷</span> Hàng đợi duyệt</a>
              <a class="nav-link" href="#sources" data-page="sources"><span>▤</span> Quản lý nguồn</a>
              <a class="nav-link" href="#monitor" data-page="monitor"><span>◷</span> Theo dõi độ mới</a>
            </nav>
            <div class="sidebar-bottom">LegalPath Editor <span>v1.0</span></div>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div class="breadcrumbs">
                    <span>Không gian biên tập</span>
                    <span>/</span>
                    <strong id="pageTitle">Quản lý nguồn</strong>
                </div>
                <div class="profile">
                    <span class="avatar" data-account-initial>E</span>
                    <span data-account-name>Biên tập viên</span>
                    <button class="icon-button" data-logout type="button" aria-label="Đăng xuất">Đăng xuất</button>
                </div>
            </header>
            <section class="page-host" aria-label="Nội dung LegalPath" aria-busy="true">
                <p class="loading" id="pageLoading" role="status">Đang tải trang...</p>
                <iframe class="page-frame" id="pageFrame" title="Nội dung LegalPath" hidden></iframe>
            </section>
        </main>
    </div>
</body>
</html>
