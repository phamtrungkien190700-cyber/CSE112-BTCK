<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | LegalPath</title>
  <link rel="stylesheet" href="../css/login/laptop.css">
  <link rel="stylesheet" href="../css/login/tablet.css" media="(min-width: 600px) and (max-width: 1023px)">
  <link rel="stylesheet" href="../css/login/mobile.css" media="(max-width: 599px)">
</head>
<body>
  <main class="page">
    <section class="auth-card" aria-labelledby="page-title">
      <!-- login- -->
      <header class="brand">
        <a class="brand-logo" href="login.html" aria-label="LegalPath - Trang chủ">
          <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 14 24 4l20 10v4H4zm3 6h6v18H7zm12 0h10v18H19zm16 0h6v18h-6zM4 41v-4h40v4L24 47z" fill="currentColor"/>
          </svg>
          <span class="brand-name">LegalPath</span>
        </a>
        <p class="brand-subtitle">Pháp luật gần bạn hơn</p>
        <p class="brand-tagline">Điều hướng thông tin pháp lý phổ thông</p>
      </header>

      <!-- ke ngang -->
      <div class="divider"></div>

      <!-- welcome -->
      <div class="intro">
        <h1 id="page-title">Đăng nhập</h1>
        <p>Chào mừng bạn trở lại với LegalPath.</p>
      </div>

      <form class="auth-form" data-auth="login">
        <div class="field">
          <label for="login-identity">Số điện thoại hoặc email</label>
          <input id="login-identity" name="identity" type="text" placeholder="Nhập số điện thoại hoặc email" required autocomplete="username">
        </div>

        <!-- điền tài khoản -->
        <div class="field">
          <label for="login-password">Mật khẩu</label>
          <div class="password-input">
            <input id="login-password" name="password" type="password" placeholder="Nhập mật khẩu" required maxlength="128" autocomplete="current-password">
            <button class="eye-icon toggle-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg viewBox="0 0 24 24">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- option-nhớ tài khoản -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="forgot-password.html">Quên mật khẩu?</a>
        </div>

        <!-- nút bấm đăng nhập -->
        <button class="primary-button" type="submit">Đăng nhập</button>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>

      <p class="switch-page">Bạn chưa có tài khoản? <a href="register.html">Đăng ký mới</a></p>
    </section>

    <p class="security-note">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.2 16 4.5v4.8c0 4-2.5 6.7-6 8.5-3.5-1.8-6-4.5-6-8.5V4.5l6-2.3Z"/>
        <path d="m7.5 9.7 1.7 1.7 3.5-3.6"/>
      </svg>
      <span>Thông tin của bạn luôn được bảo mật tại LegalPath</span>
    </p>
  </main>
  <script src="../js/login/login.js" defer></script>
</body>
</html>
