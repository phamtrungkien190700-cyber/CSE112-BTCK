<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | LegalPath</title>
  <link rel="stylesheet" href="../css/register/laptop.css">
  <link rel="stylesheet" href="../css/register/tablet.css" media="(min-width: 600px) and (max-width: 1023px)">
  <link rel="stylesheet" href="../css/register/mobile.css" media="(max-width: 599px)">
</head>
<body>
  <main class="page">
    <section class="auth-card" aria-labelledby="page-title">
      <header class="brand">
        <a class="brand-logo" href="login.html" aria-label="LegalPath - Trang chủ">
          <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M4 14 24 4l20 10v4H4zm3 6h6v18H7zm12 0h10v18H19zm16 0h6v18h-6zM4 41v-4h40v4L24 47z" fill="currentColor"/>
          </svg>
          <span class="brand-name">LegalPath</span>
        </a>
        <p class="brand-subtitle">Pháp luật gần bạn hơn</p>
        <p class="brand-tagline">Điều hướng thông tin pháp lý phổ thông</p>
      </header>

      <div class="divider"></div>

      <div class="intro">
        <h1 id="page-title">Đăng ký</h1>
        <p>Tạo tài khoản để đồng hành cùng LegalPath.</p>
      </div>

      <form class="auth-form" data-auth="register">
        <div class="field">
          <label for="register-name">Họ và tên</label>
          <input id="register-name" name="name" type="text" placeholder="Nhập họ và tên của bạn" required maxlength="100" autocomplete="name">
        </div>

        <div class="field">
          <label for="register-identity">Số điện thoại hoặc email</label>
          <input id="register-identity" name="identity" type="text" placeholder="Nhập số điện thoại hoặc email" required autocomplete="username">
        </div>

        <div class="field">
          <label for="register-role">Vai trò</label>
          <select id="register-role" name="role" required>
            <option value="" selected disabled>Chọn vai trò của bạn</option>
            <option value="user">Người dùng</option>
            <option value="legal_expert">Chuyên gia pháp lý</option>
            <option value="editor">Editor</option>
            <option value="manager">Manager</option>
          </select>
        </div>

        <div class="field">
          <label for="register-password">Mật khẩu</label>
          <div class="password-input">
            <input id="register-password" name="password" type="password" placeholder="Tạo mật khẩu" required minlength="8" maxlength="128" autocomplete="new-password">
            <button class="eye-icon toggle-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg viewBox="0 0 24 24">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
          <small class="field-hint">Tối thiểu 8 ký tự, gồm chữ và số.</small>
        </div>

        <div class="field">
          <label for="register-confirm-password">Xác nhận mật khẩu</label>
          <div class="password-input">
            <input id="register-confirm-password" name="confirm-password" type="password" placeholder="Nhập lại mật khẩu" required minlength="8" maxlength="128" autocomplete="new-password">
            <button class="eye-icon toggle-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg viewBox="0 0 24 24">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="checkbox-label agreement">
          <input type="checkbox" name="agreement" required>
          <span>Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a> của LegalPath.</span>
        </label>

        <button class="primary-button" type="submit">Đăng ký</button>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>

      <p class="switch-page">Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </section>

    <p class="security-note">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.2 16 4.5v4.8c0 4-2.5 6.7-6 8.5-3.5-1.8-6-4.5-6-8.5V4.5l6-2.3Z"/>
        <path d="m7.5 9.7 1.7 1.7 3.5-3.6"/>
      </svg>
      <span>Thông tin của bạn luôn được bảo mật tại LegalPath</span>
    </p>
  </main>
  <script src="../js/register/register.js" defer></script>
</body>
</html>
