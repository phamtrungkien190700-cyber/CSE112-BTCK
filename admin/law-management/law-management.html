<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>Quản lý lĩnh vực pháp luật | LegalPath</title>
  <link rel="stylesheet" href="css/laptop.css">
  <link rel="stylesheet" href="css/tablet.css" media="(min-width: 601px) and (max-width: 1024px)">
  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
  <link rel="stylesheet" href="../../shared/role-typography.css">
</head>
<body data-page-group="admin">
  <main class="page-content">
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Quản lý lĩnh vực pháp luật</h1>
        <p>Thêm, chỉnh sửa và xóa các lĩnh vực pháp luật được tra cứu trên nền tảng.</p>
      </div>
      <button class="add-button" type="button">
        <span aria-hidden="true">＋</span> Thêm lĩnh vực mới
      </button>
    </section>

    <div class="table-toolbar">
      <label class="search-box">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
        <span class="visually-hidden">Tìm kiếm tên hoặc mã lĩnh vực</span>
        <input id="category-search" type="search" placeholder="Tìm kiếm tên hoặc mã lĩnh vực..." autocomplete="off">
      </label>
      <p id="category-count" class="category-count" aria-live="polite">Đang tải lĩnh vực...</p>
    </div>

    <div class="table-frame">
      <table class="taxonomy-table">
        <thead>
          <tr>
            <th scope="col">Mã lĩnh vực</th>
            <th scope="col">Tên lĩnh vực</th>
            <th scope="col">Cấp độ</th>
            <th scope="col">Số thủ tục liên quan</th>
            <th scope="col">Thao tác</th>
          </tr>
        </thead>
        <tbody id="category-list">
          <tr><td class="table-message" colspan="5">Đang tải danh sách lĩnh vực...</td></tr>
        </tbody>
      </table>
    </div>
    <p id="load-error" class="load-error" role="alert" hidden></p>
  </main>
  <script src="js/action.js" defer></script>
</body>
</html>
